# Tests + practice-key evaluation on code changes. Bot answer commits use GITHUB_TOKEN,
# which never triggers workflows, so this cannot loop.
name: ci

on:
  push:
    branches: [main]
    paths: ["quizbot/**", "tests/**", "requirements*.txt", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check -r requirements-dev.txt -r requirements.txt
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: python -m pytest -q
      - name: Practice evaluation (all 1,200 keyed questions; fails below 99%)
        run: python -m quizbot evaluate --report reports/practice_eval.json
      - name: Dry run against the live source (no commits)
        run: python -m quizbot run --mode dry-run --out /tmp/dry
      - name: 12-hour graded rehearsal with injected failures (must score 100%)
        run: python -m tests.simulate_week --hours 12 2>&1 | grep -v -E " (INFO|WARNING|ERROR) "
        shell: bash -o pipefail {0}
