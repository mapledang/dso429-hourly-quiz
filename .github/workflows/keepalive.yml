# Cron-independent backstop. GitHub's `schedule` trigger is best-effort, so this workflow keeps a
# self-perpetuating chain alive:
#   * Every ~10 minutes it dispatches poll.yml (poll is the only writer).
#   * Every tick it also makes sure a successor keepalive run is queued (retrying with backoff), so a
#     single GitHub API error can no longer end the chain (it did once: HTTP 500, Oct 18 22:27 UTC).
#   * poll.yml and reconcile.yml additionally revive the chain if no keepalive run is active.
#   * After the assignment window it stops queueing successors, ending the chain.
# The concurrency group allows one running + one pending run, so chains can never multiply.
name: keepalive

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"   # extra restarter whenever GitHub's cron does fire

permissions:
  actions: write    # dispatch poll.yml and the successor keepalive run; no contents access
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 345     # hosted-runner hard limit is 6h
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      STOP_AT: "2026-10-23T02:00:00Z"   # 6h after round 168's release; chain ends after this
    steps:
      - name: Keep a successor queued and dispatch poll every 10 minutes for ~5.5 hours
        run: |
          stop=$(date -u -d "$STOP_AT" +%s)
          end=$(( $(date -u +%s) + 330*60 ))

          retry() {   # retry a command up to 5 times with exponential backoff; never abort the loop
            for i in 1 2 3 4 5; do "$@" && return 0; sleep $(( 5 * 2**i )); done
            echo "$(date -u +%FT%TZ) giving up this tick on: $*"; return 1
          }
          ensure_successor() {
            [ "$(date -u +%s)" -lt "$stop" ] || return 0
            waiting=$(gh run list --repo "$REPO" --workflow keepalive.yml --limit 20 \
                        --json status,databaseId \
                        --jq "[.[] | select(.databaseId != ${{ github.run_id }} and .status != \"completed\")] | length") || waiting=0
            if [ "${waiting:-0}" -lt 1 ]; then
              retry gh workflow run keepalive.yml --repo "$REPO" --ref main && echo "$(date -u +%FT%TZ) successor queued"
            fi
          }

          while [ "$(date -u +%s)" -lt "$end" ] && [ "$(date -u +%s)" -lt "$stop" ]; do
            ensure_successor || true
            retry gh workflow run poll.yml --repo "$REPO" --ref main && echo "$(date -u +%FT%TZ) dispatched poll" || true
            sleep 600
          done
          ensure_successor || true
